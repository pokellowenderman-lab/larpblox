
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Larpblox</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="#" data-page="Home">Larpblox</a>
    <nav class="topnav">
      <a href="#" data-page="Games">Games</a>
      <a href="#" data-page="Catalog">Catalog</a>
      <a href="#" data-page="Avatar">Avatar</a>
    </nav>
    <div class="account" id="account-area"></div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="side-user" id="side-user">Welcome!</div>
      <a href="#" data-page="Home">Home</a>
      <a href="#" data-page="Profile">Profile</a>
      <a href="#" data-page="Games">Games</a>
      <a href="#" data-page="Catalog">Catalog</a>
      <a href="#" data-page="Avatar">Avatar</a>
      <div class="currency">
        <strong>Larpbux</strong>
        <div id="currency-count">0</div>
      </div>
    </aside>

    <main id="main-content">
      <h1>Welcome to Larpblox!</h1>
      <p>Your place to build, play, and explore.</p>
    </main>
  </div>

  <footer>
    Larpblox — A community-made revival project.
  </footer>

  <script src="script.js"></script>
</body>
</html>
